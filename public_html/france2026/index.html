      <figure class="text">
        <p>My trip to France was an amazing and unforgettable experience. As a multimedia student, I had the opportunity
          to attend school there and see how students learn in a different environment. I explored a new culture, tried
          different foods, learned how to use new equipment, and met new people. This experience helped me become more
          independent and made me realize what path of design I would like to pursue. It’s something I will always
          remember.</p>

  <section id="project1" class="section-title-left">
    <h1>Belfry of Arras Event</h1>
    <h2>WEEK 1</h2>

    <figure class="text">
      <p>I collaborated with a team of four students, one Canadian and three French, on a creative project based on the
        Belfry of Arras. The French students developed the concept for an event inspired by this historic monument,
        while we, as the Canadian team, focused on producing the visual content.
        After visiting the site and capturing our own photos and videos, I was responsible for designing the official
        promotional poster and an Instagram carousel.</p>
    </figure>

    <div class="content">

  <section id="project2" class="section-title-right">
    <h1>SAME OR NOT</h1>
    <h2>WEEK 2</h2>

    <figure class="text">
      <p>I collaborated with a team of ten students, three Canadian and seven French, on a Web TV project called SAME OR
        NOT. The show explored the differences and similarities between French and Québécois cultures, focusing on
        lifestyle, food, and festivals.
        Over four days, we prepared all the assets needed for the presentation. I was responsible for designing the
        visual concept and creating the logo. During the presentation, I served as the director for the food segment and
        acted in the festivals segment.</p>
    </figure>

  <section class="section-title-left">
    <h1>WHAT I LEARNED</h1>
    <h2>WEEKS 1 - 2</h2>

    <figure class="text">
      <p>After this exchange program, I gained a deeper understanding of event planning and the behind-the-scenes work
        involved in live shows. I had always had a general idea of how these processes worked, but being directly
        involved in the preparations confirmed that this is the field I want to pursue in the future. I especially
        enjoyed starting from a blank slate and helping transform ideas into a fully realized project.

        One of the biggest challenges I faced during the two weeks was the language barrier. Although I speak French in
        Québec, I initially struggled to follow the French students, who spoke very quickly in modern French. To adapt,
        I relied on hand gestures and other nonverbal communication to stay involved and collaborate effectively.

        Overall, this experience strengthened my problem-solving and teamwork skills and highlighted the value of
        adaptability and creative collaboration in bringing a project to life. It has solidified my desire to pursue a
        career in the design aspects of event planning.</p>
    </figure>
