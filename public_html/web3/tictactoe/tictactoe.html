<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheila - Tic Tac Toe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georama:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/tictactoe.css">
</head>
<body>
    <header>
        <h1>Plantes vs Zombies</h1>
        <h2>Tic - Tac - Toe</h2>

    </header>

    <main>

        <section class="game-container">

            <article class="board" id="board">

                <figure class="cell" id="cell-0"></figure>
                <figure class="cell" id="cell-1"></figure>
                <figure class="cell" id="cell-2"></figure>
                <figure class="cell" id="cell-3"></figure>
                <figure class="cell" id="cell-4"></figure>
                <figure class="cell" id="cell-5"></figure>
                <figure class="cell" id="cell-6"></figure>
                <figure class="cell" id="cell-7"></figure>
                <figure class="cell" id="cell-8"></figure>

            </article>
            
            <article class="status" id="status">Sunflower's turn</article>

            <button class="restart-botton" onclick="restartGame()">Restart</button>

        </section>
    </main>

 
</body>
</html>
